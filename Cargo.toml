[workspace]
resolver = "3"
members = [
    "crates/openwraith-protocol",
    "crates/openwraith-hid",
    "crates/openwraith-cli",
    "crates/openwraith-app-core",
    "app/src-tauri",
]
# `cargo build` / `cargo build --release` without `-p` builds the CLI and
# the libraries only: the desktop app needs the Tauri prerequisites, Rust
# 1.95 and a built frontend (`npm --prefix app run tauri build`).
# `--workspace` commands still cover every member.
default-members = [
    "crates/openwraith-protocol",
    "crates/openwraith-hid",
    "crates/openwraith-cli",
    "crates/openwraith-app-core",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Zeruh31/openwraith"
# 1.89: `std::fs::File::try_lock` / `try_lock_shared` for the device lock
# shared by the CLI and the desktop app (`openwraith_hid::coordination`).
# The desktop app crate (app/src-tauri) needs a newer Rust of its own.
rust-version = "1.89"

[workspace.dependencies]
openwraith-protocol = { path = "crates/openwraith-protocol" }
openwraith-hid = { path = "crates/openwraith-hid" }
openwraith-app-core = { path = "crates/openwraith-app-core" }

# Third-party crates, pinned to a minor version.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
hidapi = "2.6"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
tempfile = "3.27"
# Ctrl+C handling of the CLI's write commands (cancel at the next table boundary;
# in a restore's keymap group after its Fn keymap).
ctrlc = "3.5"

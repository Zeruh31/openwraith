[package]
name = "openwraith-app"
description = "OpenWraith desktop app: backup and restore, actuation and Rapid Trigger, and lighting for the Wraith W75 (not affiliated with Wraith)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Tauri 2.12 (and its plugins) need Rust 1.90, the highest `rust-version` of
# the app's dependencies.
rust-version = "1.90"
publish = false
default-run = "openwraith-app"

[lib]
name = "openwraith_app_lib"
crate-type = ["rlib"]

[[bin]]
name = "openwraith-app"
path = "src/main.rs"

[features]
# The developer simulator (debug builds only; `npm run dev`).
sim = ["openwraith-app-core/sim"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
openwraith-app-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `tray-icon`: the opt-in notification-area icon (design B5).
tauri = { version = "=2.12.3", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-opener = "=2.7.1"
tauri-plugin-single-instance = "=2.5.3"
# OS notifications, shown from Rust only (no webview permission).
tauri-plugin-notification = "=2.6.0"
sys-locale = "=0.3.2"
# The per-game profiles' platform feed: the program in front.
active-win-pos-rs = "=0.11.0"

[target.'cfg(windows)'.dependencies]
# The running programs and the exits of the watched games (`winproc.rs`, the
# app's only `unsafe`): one process snapshot, and a process opened with
# `PROCESS_QUERY_LIMITED_INFORMATION` only.
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }
# "Start with Windows" (`autostart.rs`, safe API): the per-user Run value,
# and Task Manager's choice read only.
windows-registry = "=0.6.1"

[package]
name = "openwraith-app"
description = "OpenWraith desktop app: backup and restore, actuation and Rapid Trigger, and lighting for the Wraith W75 (not affiliated with Wraith)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Tauri 2.12 needs Rust 1.90; sysinfo 0.39 (the running programs and their
# exits for the per-game profiles) needs Rust 1.95.
rust-version = "1.95"
publish = false
default-run = "openwraith-app"

[lib]
name = "openwraith_app_lib"
crate-type = ["rlib"]

[[bin]]
name = "openwraith-app"
path = "src/main.rs"

[features]
# The developer simulator (debug builds only; `npm run dev`).
sim = ["openwraith-app-core/sim"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
openwraith-app-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `tray-icon`: the opt-in notification-area icon (design B5).
tauri = { version = "=2.12.3", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-opener = "=2.7.1"
tauri-plugin-single-instance = "=2.5.3"
# OS notifications, shown from Rust only (no webview permission).
tauri-plugin-notification = "=2.6.0"
# "Start with Windows": the per-user Run entry, from Rust only.
tauri-plugin-autostart = "=2.7.0"
sys-locale = "=0.3.2"
# The per-game profiles' platform feed: the program in front (no `unsafe`
# in OpenWraith) and the running programs / their exits (processes only).
active-win-pos-rs = "=0.11.0"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }

[package]
name = "openwraith-cli"
description = "Read-only command line tool for the Wraith W75 keyboard: device info, readable settings tables and lossless backups."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["keyboard", "hid", "wraith", "hall-effect", "cli"]
categories = ["command-line-utilities", "hardware-support"]

[[bin]]
name = "openwraith"
path = "src/main.rs"

[dependencies]
openwraith-hid = { workspace = true }
openwraith-protocol = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Backups replayed from the USB captures, so tests never need a keyboard.
openwraith-hid = { workspace = true, features = ["mock"] }
